# Reverse proxy du conteneur web : sert le client compilé et renvoie /api vers
# l'API. Volontairement sans TLS — en production, placez ce conteneur derrière
# votre terminaison TLS (voir docs/installation.md §2.5 pour la configuration
# nginx complète, avec certificats).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pièces jointes : 10 Mo côté application ; la limite nginx par défaut (1 Mo)
    # les rejetterait avant d'atteindre Node. Couvre aussi les rapports
    # d'inventaire (5 Mo sur /api/inventory ; montez à 16M si vous poussez des
    # inventaires GLPI de plus de 12 Mo sur /api/inventory/glpi).
    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.html;   # SPA : repli sur index.html
    }

    # Les fichiers versionnés par Vite (hash dans le nom) sont immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
