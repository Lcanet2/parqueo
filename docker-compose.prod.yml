# Stack Parqueo de production : images publiées, rien à construire, TLS
# automatique.
#
#   curl -fsSL https://parqueo.fr/install.sh | sh
#
# ou, à la main :
#
#   curl -fsSL https://raw.githubusercontent.com/Lcanet2/parqueo/main/docker-compose.prod.yml -o docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/Lcanet2/parqueo/main/.env.docker.example -o .env
#   # renseigner DOMAIN, générer les secrets, puis :
#   docker compose up -d
#
# Mise à jour :   docker compose pull && docker compose up -d
# Sauvegarde  :   docker compose exec -T db pg_dump -U parqueo parqueo | gzip > parqueo-$(date +%F).sql.gz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parqueo}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?manquant — relancez install.sh ou renseignez .env}'
      POSTGRES_DB: ${POSTGRES_DB:-parqueo}
    volumes:
      - parqueo-db:/var/lib/postgresql/data
    healthcheck:
      # L'API attend une base réellement prête, pas seulement un conteneur démarré.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-parqueo} -d ${POSTGRES_DB:-parqueo}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/lcanet2/parqueo-api:${PARQUEO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-parqueo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parqueo}?schema=public'
      # Aucune valeur par défaut : un secret partagé publiquement laisserait
      # n'importe qui forger un jeton d'administrateur.
      JWT_SECRET: '${JWT_SECRET:?manquant — relancez install.sh ou renseignez .env}'
      PORT: '4000'
      # Front et API partagent l'origine du conteneur web : CORS sans objet.
      # L'URL sert aux liens des emails et à la redirection SSO.
      # Une seule source pour l'URL publique : sans elle, « https://${DOMAIN} »
      # donnait « https:// » quand DOMAIN n'était pas défini — et compose
      # avertissait à chaque commande. L'installeur renseigne PUBLIC_URL.
      CLIENT_ORIGIN: '${PUBLIC_URL:-http://localhost}'
      APP_URL: '${PUBLIC_URL:-http://localhost}'
      # Pose la catégorie et l'équipe par défaut sur une base vierge. Aucun
      # compte n'est créé : l'administrateur se crée à la première visite.
      SEED_ON_START: '${SEED_ON_START:-true}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      SMTP_FROM: '${SMTP_FROM:-Parqueo <no-reply@parqueo.local>}'
      INVENTORY_TOKEN: '${INVENTORY_TOKEN:-}'
      SSO_TENANT_ID: '${SSO_TENANT_ID:-}'
      SSO_CLIENT_ID: '${SSO_CLIENT_ID:-}'
      SSO_CLIENT_SECRET: '${SSO_CLIENT_SECRET:-}'
    volumes:
      # Les pièces jointes vivent hors du conteneur : elles survivent aux
      # mises à jour d'image.
      - parqueo-uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    image: ghcr.io/lcanet2/parqueo-web:${PARQUEO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Un nom de domaine ici et Caddy obtient un certificat Let's Encrypt au
      # premier démarrage, puis le renouvelle seul. Sans DOMAIN, HTTP simple.
      SITE_ADDRESS: '${DOMAIN:-:80}'
    ports:
      # 80 est nécessaire même en HTTPS : Let's Encrypt y valide le domaine, et
      # Caddy s'en sert pour rediriger vers HTTPS.
      - '80:80'
      - '443:443'
    volumes:
      - parqueo-caddy:/data

volumes:
  parqueo-db:
  parqueo-uploads:
  # Certificats et clés de compte ACME : sans persistance, Caddy en redemande à
  # chaque redémarrage et se fait limiter par Let's Encrypt.
  parqueo-caddy:
