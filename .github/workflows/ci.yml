name: CI

on:
  push:
    branches: [main]
    # Une version poussée déclenche la publication des images (job « publier »).
    tags: ['v*']
  pull_request:

jobs:
  serveur:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parqueo
          POSTGRES_PASSWORD: parqueo
          POSTGRES_DB: parqueo_test
        ports:
          - 5432:5432
        # Les étapes suivantes doivent attendre une base réellement prête.
        options: >-
          --health-cmd "pg_isready -U parqueo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://parqueo:parqueo@localhost:5432/parqueo_test?schema=public
      # Factice, mais de longueur réaliste : l'API refuse de démarrer
      # avec un secret de moins de 16 caractères.
      JWT_SECRET: secret-de-ci-uniquement-pour-les-tests

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Sans --omit=dev : la CLI Prisma qui applique les migrations est une
      # dépendance de développement.
      - run: npm ci

      - run: npx prisma generate

      - name: Migrations sur la base de test
        run: npx prisma migrate deploy

      - name: Tests unitaires (logique pure, sans base)
        run: npm test

      - name: Tests d'API (bout en bout)
        run: npm run test:api

  client:
    name: Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest

    # Au niveau du job, et non par étape : docker-compose.yml exige ces deux
    # variables pour être interpolé, donc TOUTE commande `docker compose` en a
    # besoin — y compris `logs` et `down`, qui ne les avaient pas et faisaient
    # échouer le job après une stack pourtant démarrée et vérifiée.
    env:
      # Factice, mais de longueur réaliste : l'API refuse de démarrer
      # avec un secret de moins de 16 caractères.
      JWT_SECRET: secret-de-ci-uniquement-pour-les-tests
      POSTGRES_PASSWORD: parqueo

    steps:
      - uses: actions/checkout@v4

      # Vérifie que la stack d'évaluation reste constructible et démarrable.
      - name: Valider docker-compose.yml
        run: docker compose config --quiet

      - name: Construire les images
        run: docker compose build

      - name: Démarrer la stack et attendre l'API
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              echo "API prête"
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas répondu à temps"
          docker compose logs
          exit 1

      - name: Vérifier que le client est servi sur la même origine
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt
        if: always()
        run: docker compose down -v

  publier:
    name: Publier les images
    runs-on: ubuntu-latest
    # Uniquement sur une version taguée, et seulement si tout est vert : une
    # image publiée est tirée par des installations réelles, elle ne doit jamais
    # sortir d'un commit dont les tests échouent.
    needs: [serveur, client, docker]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - nom: api
            dockerfile: server/Dockerfile
          - nom: web
            dockerfile: client/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produit les étiquettes à partir du tag git : 1.4.2, 1.4 et latest.
      # « latest » est ce que tire une installation neuve ; « 1.4 » permet de
      # suivre les correctifs sans changer de version majeure.
      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/parqueo-${{ matrix.nom }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
